# Color scheme
mauve="#ca9ee6"
red="#e78284"
peach="#ef9f76"
yellow="#e5c890"
green="#a6d189"
teal="#81c8be"
sapphire="#85c1dc"
blue="#8caaee"
lavender="#babbf1"
text="#c6d0f5"
tmux=" "
tab="󰓩 "

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Options
set -g base-index 1
set -g pane-base-index 1
set -g mouse on
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
unbind r
bind r source ~/.config/tmux/tmux.conf
bind e kill-session

# Status bar
set -g status-position top
set -g status-left-length 10
set -g status-style "fg=${text},bg=default"
set -g status-left "#[fg=${mauve},bold]${tmux}#S#[fg=${text},nobold] | "
set -g status-right "#(date '+%D')"
set -g window-status-current-format "#[fg=${mauve},bold]${tab}#[underscore]#I:#W#[nounderscore]"
set -g window-status-format "#I:#W"
set -g message-style "fg=${text},bg=default"
set -g pane-active-border-style "fg=${green}"

# Initialize tmux plugin manager
run '~/.config/tmux/plugins/tpm/tpm'
